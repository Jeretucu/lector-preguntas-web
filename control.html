<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Control - Lector de Preguntas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b1220; color:#e5e7eb; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

header { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
h1 { font-size:1.1rem; } h1 span { color:#4fc3f7; }
.link-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; display:inline-block; margin-right:5px; }
.link-dot.off { background:#374151; }
#cfg-toggle { background:none; border:none; color:#6b7280; font-size:1.15rem; cursor:pointer; padding:2px 6px; }
#cfg-toggle:hover { color:#e5e7eb; }
#mode-toggle { padding:5px 10px; border:1px solid #374151; border-radius:16px; background:#1f2937;
               color:#e5e7eb; font-size:.75rem; font-weight:600; cursor:pointer; white-space:nowrap; }

#cfg-panel { background:#111827; border-bottom:1px solid #1f2937; padding:10px 14px;
             display:flex; flex-direction:column; gap:7px; }
.cfg-row { display:flex; gap:8px; align-items:center; }
.cfg-row label { font-size:.72rem; color:#9ca3af; white-space:nowrap; min-width:56px; }
.cfg-row input { flex:1; background:#1f2937; border:1px solid #374151; border-radius:8px;
                 padding:7px 10px; color:#e5e7eb; font-size:.8rem; font-family:monospace; }
.cfg-row button { padding:7px 12px; border:none; border-radius:8px; background:#2563eb;
                  color:#fff; font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap; }
.cfg-hint { font-size:.68rem; color:#4b5563; }

.preview-wrap { position:relative; background:#000; width:100%; max-height:26vh; min-height:14vh;
                display:flex; align-items:center; justify-content:center; border-bottom:1px solid #1f2937; overflow:hidden; }
#preview-img, #local-video { width:100%; max-height:26vh; object-fit:contain; display:none; }
#preview-empty { color:#374151; font-style:italic; font-size:.85rem; text-align:center; padding:10px; }

.answer-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
               padding:24px 16px; border-bottom:1px solid #1f2937; min-height:26vh; }
.answer-big { font-size:1.3rem; font-weight:800; color:#4ade80; text-align:center; line-height:1.3; margin:6px 0; }
.answer-empty { color:#374151; font-style:italic; font-size:1rem; text-align:center; }
.answer-q { color:#6b7280; font-size:.85rem; text-align:center; margin-bottom:14px; }

.shoot-wrap { padding:20px; display:flex; justify-content:center; }
#shoot-btn { width:110px; height:110px; border-radius:50%; background:#2563eb; border:6px solid #1d4ed8;
             color:#fff; font-size:2.2rem; cursor:pointer; }
#shoot-btn:disabled { opacity:.4; cursor:default; }
#shoot-btn.waiting { background:#f59e0b; border-color:#d97706; }

#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
         background:#1f2937; border:1px solid #374151; border-radius:12px;
         padding:10px 18px; font-size:.9rem; font-weight:600; color:#fff;
         opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; text-align:center; }
#toast.show { opacity:1; }
#toast.ok   { border-color:#22c55e; color:#4ade80; }
#toast.err  { border-color:#dc2626; color:#f87171; }

.history-header { padding:10px 14px 6px; display:flex; justify-content:space-between; align-items:center; }
.history-header h2 { font-size:.9rem; color:#9ca3af; }
#btn-clear { font-size:.75rem; color:#6b7280; background:none; border:none; cursor:pointer; }
#history { overflow-y:auto; padding:0 14px 14px; max-height:30vh; }
.record { background:#1f2937; border-radius:8px; padding:10px 12px; margin-bottom:8px; border-left:5px solid #22c55e; }
.record .a { font-size:.85rem; color:#4ade80; font-weight:700; white-space:pre-line; }
.record .t { font-size:.7rem; color:#6b7280; margin-top:2px; }
.history-empty { color:#374151; font-style:italic; text-align:center; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>🎮 <span>Control</span></h1>
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:#9ca3af;">
      <span id="link-dot" class="link-dot off"></span>Cámara
    </span>
    <button id="cfg-toggle" title="Configurar API Key">⚙</button>
    <button id="mode-toggle">📡 Cámara remota</button>
  </div>
</header>
<div id="cfg-panel" style="display:none;">
  <div class="cfg-row">
    <label>API Key</label>
    <input id="apikey-input" type="password" placeholder="OpenRouter API Key (sk-or-...)" />
    <button id="cfg-save">OK</button>
  </div>
  <div class="cfg-row">
    <label>Modelo</label>
    <input id="model-input" type="text" placeholder="google/gemini-2.5-pro" />
    <button id="model-save">OK</button>
  </div>
  <div class="cfg-hint">Solo hace falta si usás "esta cámara" (modo local). En modo remoto, la key vive en el otro dispositivo.</div>
</div>

<div class="preview-wrap">
  <img id="preview-img" alt="vista de la cámara" />
  <video id="local-video" playsinline muted autoplay></video>
  <div id="preview-empty">Sin señal de la cámara</div>
</div>

<div class="answer-area" id="answer-area">
  <div class="answer-empty" id="answer-empty">Tocá el botón para sacar la foto</div>
</div>

<div class="shoot-wrap">
  <button id="shoot-btn" title="Sacar foto">📸</button>
</div>

<div id="toast"></div>

<div class="history-header">
  <h2>Historial</h2>
  <button id="btn-clear">Limpiar todo</button>
</div>
<div id="history"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAA7f_lOBBgEWTnY2sMyJgTGopwwkY13uY",
  authDomain: "lector-preguntas.firebaseapp.com",
  databaseURL: "https://lector-preguntas-default-rtdb.firebaseio.com",
  projectId: "lector-preguntas",
  storageBucket: "lector-preguntas.firebasestorage.app",
  messagingSenderId: "243188251668",
  appId: "1:243188251668:web:27169742115518ab0cbb01"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const $ = id => document.getElementById(id);
const shootBtn = $('shoot-btn');
let waiting = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

let toastTimer;
function showToast(msg, type='') {
  const t = $('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ==== config (solo hace falta en modo camara local) ====
const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';
const DEFAULT_MODEL = 'google/gemini-2.5-pro';
const PROMPT = `Sos un asistente que responde preguntas de opción múltiple mostradas en una imagen (foto de una pantalla). Analizá la imagen, identificá la pregunta y las opciones, y determiná cuál es la opción correcta.
Respondé ÚNICAMENTE con un JSON válido, sin texto adicional, sin bloques de código markdown, con este formato exacto:
{"pregunta": "enunciado de la pregunta", "respuesta": "texto EXACTO de la opción correcta, copiado tal cual aparece en la imagen"}
Reglas para "respuesta":
- NO la traduzcas. Copiala en el idioma original de la imagen, letra por letra.
- Incluí la letra o número que identifica la opción tal cual aparece en la imagen (ej. "B. Set the Fiscal Year to Custom..."), seguido del texto completo de la opción.
- Si hay más de una opción correcta (ej. "Choose 2 answers"), poné cada una en una línea separada por un salto de línea "\\n", cada una con su letra/número correspondiente.
Si la imagen no contiene una pregunta de opción múltiple legible, respondé: {"error": "No se detectó una pregunta de opción múltiple en la imagen"}`;

let apiKey = localStorage.getItem('lp_api_key') || '';
let model = localStorage.getItem('lp_model') || DEFAULT_MODEL;

$('cfg-toggle').onclick = () => {
  const p = $('cfg-panel');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  if (p.style.display === 'flex') {
    $('apikey-input').value = apiKey;
    $('model-input').value = model;
  }
};
$('cfg-save').onclick = () => {
  apiKey = $('apikey-input').value.replace(/\s+/g, '');
  localStorage.setItem('lp_api_key', apiKey);
  showToast(apiKey ? 'API Key guardada' : 'API Key borrada', apiKey ? 'ok' : '');
};
$('model-save').onclick = () => {
  model = $('model-input').value.trim() || DEFAULT_MODEL;
  localStorage.setItem('lp_model', model);
  showToast('Modelo guardado: ' + model, 'ok');
};

function parseResult(raw) {
  const cleaned = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  try { return JSON.parse(match ? match[0] : cleaned); }
  catch (e) { return { error: 'No se pudo interpretar la respuesta del modelo' }; }
}

async function analyzeImage(dataUrl) {
  const res = await fetch(OPENROUTER_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey,
      'HTTP-Referer': location.href,
      'X-Title': 'Lector de Preguntas (control)'
    },
    body: JSON.stringify({
      model,
      temperature: 0.2,
      messages: [{
        role: 'user',
        content: [
          { type: 'text', text: PROMPT },
          { type: 'image_url', image_url: { url: dataUrl } }
        ]
      }]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error((data.error.message || JSON.stringify(data.error)) + ' (HTTP ' + res.status + ')');
  return parseResult(data.choices?.[0]?.message?.content || '');
}

// ==== modo: camara remota vs camara de este dispositivo ====
let mode = localStorage.getItem('ctrl_mode') || 'remote';
let localStream = null;
const localVideo = $('local-video');

function applyMode() {
  const modeBtn = $('mode-toggle');
  if (mode === 'local') {
    modeBtn.textContent = '📷 Esta cámara';
    $('preview-img').style.display = 'none';
    startLocalCamera();
  } else {
    modeBtn.textContent = '📡 Cámara remota';
    stopLocalCamera();
  }
}

$('mode-toggle').onclick = async () => {
  mode = mode === 'remote' ? 'local' : 'remote';
  localStorage.setItem('ctrl_mode', mode);
  applyMode();
};

async function startLocalCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    localVideo.srcObject = localStream;
    localVideo.style.display = 'block';
    $('preview-empty').style.display = 'none';
  } catch (e) {
    showToast('Error de cámara: ' + e.message, 'err');
    mode = 'remote'; localStorage.setItem('ctrl_mode', mode); applyMode();
  }
}
function stopLocalCamera() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  localVideo.srcObject = null;
  localVideo.style.display = 'none';
}

shootBtn.onclick = () => {
  if (mode === 'local') { shootLocal(); return; }
  waiting = true;
  shootBtn.disabled = true; shootBtn.classList.add('waiting'); shootBtn.textContent = '⏳';
  $('answer-area').innerHTML = '<div class="answer-empty">⏳ Analizando pregunta...</div>';
  set(ref(db, 'trigger'), { ts: Date.now() });
};

async function shootLocal() {
  if (!apiKey) { showToast('Configurá tu API Key primero (⚙)', 'err'); $('cfg-panel').style.display = 'flex'; return; }
  if (!localVideo.videoWidth) { showToast('La cámara todavía no está lista', 'err'); return; }
  waiting = true;
  shootBtn.disabled = true; shootBtn.classList.add('waiting'); shootBtn.textContent = '⏳';
  $('answer-area').innerHTML = '<div class="answer-empty">⏳ Analizando pregunta...</div>';
  const canvas = document.createElement('canvas');
  canvas.width = localVideo.videoWidth; canvas.height = localVideo.videoHeight;
  canvas.getContext('2d').drawImage(localVideo, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  try {
    const r = await analyzeImage(dataUrl);
    renderAnswer(r);
    stopWaiting();
    if (!r.error) { saveHistory(r); showToast('Respuesta lista', 'ok'); }
    else showToast('Error al analizar', 'err');
  } catch (e) {
    renderAnswer({ error: e.message });
    stopWaiting();
    showToast('Error al analizar', 'err');
  }
}

function stopWaiting() {
  waiting = false;
  shootBtn.disabled = false; shootBtn.classList.remove('waiting'); shootBtn.textContent = '📸';
}

// ==== vista previa en vivo de la camara remota ====
onValue(ref(db, 'preview'), (snap) => {
  if (mode !== 'remote') return;
  const p = snap.val();
  const img = $('preview-img'), empty = $('preview-empty');
  if (p && p.img) { img.src = p.img; img.style.display = 'block'; empty.style.display = 'none'; }
  else { img.style.display = 'none'; empty.style.display = 'block'; }
});

// ==== resultado en vivo desde la camara remota ====
onValue(ref(db, 'result'), (snap) => {
  const r = snap.val();
  if (!r) return;
  $('link-dot').classList.remove('off');
  if (mode !== 'remote') return;
  renderAnswer(r);
  if (waiting) { stopWaiting(); saveHistory(r); showToast(r.error ? 'Error' : 'Respuesta lista', r.error ? 'err' : 'ok'); }
});

function renderAnswer(r) {
  if (r.error) {
    $('answer-area').innerHTML = `<div class="answer-empty" style="color:#f87171;">Error: ${escapeHtml(r.error)}</div>`;
    return;
  }
  const lines = String(r.respuesta || '').split('\n').map(s => s.trim()).filter(Boolean);
  const answerHtml = lines.length
    ? lines.map(l => `<div class="answer-big">${escapeHtml(l)}</div>`).join('')
    : '<div class="answer-empty">?</div>';
  $('answer-area').innerHTML = `
    ${r.pregunta ? `<div class="answer-q">${escapeHtml(r.pregunta)}</div>` : ''}
    ${answerHtml}`;
}

// ==== historial local ====
let records = JSON.parse(localStorage.getItem('ctrl_records') || '[]');

function saveHistory(r) {
  if (r.error) return;
  records.unshift({ pregunta: r.pregunta, respuesta: r.respuesta, ts: Date.now() });
  records = records.slice(0, 50);
  localStorage.setItem('ctrl_records', JSON.stringify(records));
  renderHistory();
}

function renderHistory() {
  const el = $('history');
  if (!records.length) { el.innerHTML = '<div class="history-empty">Sin preguntas aún</div>'; return; }
  el.innerHTML = records.map(r => `
    <div class="record">
      <div class="a">${escapeHtml(r.respuesta || '?')}</div>
      <div class="t">${new Date(r.ts).toLocaleString('es-AR')}</div>
    </div>`).join('');
}

$('btn-clear').onclick = () => {
  if (confirm('¿Borrar todo el historial?')) { records = []; localStorage.removeItem('ctrl_records'); renderHistory(); }
};

renderHistory();
applyMode();
</script>
</body>
</html>
