<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Lector de Preguntas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0b1220; color:#e5e7eb; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

/* ---- header ---- */
header { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
h1 { font-size:1.1rem; } h1 span { color:#4fc3f7; }
#startbtn { padding:7px 16px; border:2px solid #16a34a; border-radius:20px; background:#0b1220;
            color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; }
#startbtn.on { background:#16a34a; }

/* ---- config panel ---- */
#cfg-toggle { background:none; border:none; color:#6b7280; font-size:1.2rem; cursor:pointer; padding:4px 8px; }
#cfg-toggle:hover { color:#e5e7eb; }
.api-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; display:inline-block; margin-right:5px; }
.api-dot.off { background:#374151; }
#cfg-panel { background:#111827; border-bottom:1px solid #1f2937; padding:10px 14px;
             display:flex; flex-direction:column; gap:7px; }
.cfg-row { display:flex; gap:8px; align-items:center; }
.cfg-row label { font-size:.72rem; color:#9ca3af; white-space:nowrap; min-width:56px; }
.cfg-row input { flex:1; background:#1f2937; border:1px solid #374151; border-radius:8px;
                 padding:7px 10px; color:#e5e7eb; font-size:.8rem; font-family:monospace; }
.cfg-row button { padding:7px 12px; border:none; border-radius:8px; background:#2563eb;
                  color:#fff; font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap; }
.cfg-hint { font-size:.68rem; color:#4b5563; }

/* ---- stage / camara ---- */
.stage { position:relative; background:#000; width:100%; max-height:45vh; overflow:hidden; }
#video { width:100%; display:block; max-height:45vh; object-fit:contain; background:#000; transform-origin:center center; }
#snapshot { width:100%; display:none; max-height:45vh; object-fit:contain; background:#000; }
#remote-status { position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
                 background:rgba(0,0,0,.6); padding:5px 12px; border-radius:20px;
                 font-size:.78rem; color:#9ca3af; }
#remote-status.linked { color:#4ade80; }

/* ---- zoom ---- */
.zoom-bar { display:flex; align-items:center; justify-content:center; gap:14px; padding:8px 14px;
            border-bottom:1px solid #1f2937; }
.zoom-bar button { width:36px; height:36px; border-radius:50%; border:1px solid #374151; background:#1f2937;
                    color:#e5e7eb; font-size:1.1rem; font-weight:700; cursor:pointer; }
.zoom-bar button:disabled { opacity:.3; cursor:default; }
#zoom-label { font-size:.85rem; color:#9ca3af; min-width:44px; text-align:center; }

/* ---- panel resultado ---- */
.result-panel { padding:14px; border-bottom:1px solid #1f2937; }
.result-empty { color:#374151; font-style:italic; text-align:center; padding:20px 0; }
.q-text { font-size:1.05rem; font-weight:600; margin-bottom:10px; }
.opt { padding:9px 12px; border-radius:8px; background:#1f2937; margin-bottom:6px; font-size:.92rem;
       border-left:4px solid #374151; }
.opt.correct { border-left-color:#22c55e; background:#052e16; color:#4ade80; font-weight:700; }
.explicacion { margin-top:10px; font-size:.8rem; color:#9ca3af; }
.loading { text-align:center; padding:20px 0; color:#4fc3f7; }
.answer-big { font-size:1.7rem; font-weight:800; color:#4ade80; text-align:center; padding:16px 6px; line-height:1.3; }
.actions-row { display:flex; gap:10px; justify-content:center; margin-top:12px; }
.actions-row button { flex:1; max-width:180px; padding:10px; border:none; border-radius:10px;
                       font-size:.95rem; font-weight:700; cursor:pointer; background:#2563eb; color:#fff; }

/* ---- toast ---- */
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
         background:#1f2937; border:1px solid #374151; border-radius:12px;
         padding:10px 18px; font-size:.9rem; font-weight:600; color:#fff;
         opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; text-align:center; }
#toast.show { opacity:1; }
#toast.ok   { border-color:#22c55e; color:#4ade80; }
#toast.err  { border-color:#dc2626; color:#f87171; }

/* ---- historial ---- */
.history-header { padding:10px 14px 6px; display:flex; justify-content:space-between; align-items:center; }
.history-header h2 { font-size:.9rem; color:#9ca3af; }
#btn-clear { font-size:.75rem; color:#6b7280; background:none; border:none; cursor:pointer; }
#history { overflow-y:auto; flex:1; padding:0 14px 14px; }
.record { background:#1f2937; border-radius:8px; padding:10px 12px; margin-bottom:8px;
          border-left:5px solid #22c55e; cursor:pointer; }
.record .q { font-size:.85rem; color:#e5e7eb; }
.record .a { font-size:.8rem; color:#4ade80; font-weight:700; margin-top:3px; white-space:pre-line; }
.record .t { font-size:.7rem; color:#6b7280; margin-top:2px; }
.history-empty { color:#374151; font-style:italic; text-align:center; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>🧠 <span>Preguntas</span></h1>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="api-dot" class="api-dot off" title="API no configurada"></span>
    <button id="cfg-toggle" title="Configurar API Key">⚙</button>
    <button id="startbtn">▶ Iniciar cámara</button>
  </div>
</header>
<div id="cfg-panel" style="display:none;">
  <div class="cfg-row">
    <label>API Key</label>
    <input id="apikey-input" type="password" placeholder="OpenRouter API Key (sk-or-...)" />
    <button id="cfg-save">OK</button>
  </div>
  <div class="cfg-row">
    <label>Modelo</label>
    <input id="model-input" type="text" placeholder="google/gemini-2.5-pro" />
    <button id="model-save">OK</button>
  </div>
  <div class="cfg-hint">La key se guarda solo en este navegador (localStorage). Conseguila en openrouter.ai/keys</div>
  <div class="cfg-hint" id="key-status" style="color:#4ade80;"></div>
</div>
<div id="toast"></div>

<div class="stage">
  <video id="video" playsinline muted autoplay></video>
  <img id="snapshot" alt="captura" />
  <div id="remote-status">Iniciá la cámara para habilitar el disparo remoto</div>
</div>

<div class="zoom-bar">
  <button id="zoom-out" disabled>－</button>
  <span id="zoom-label">1.0x</span>
  <button id="zoom-in" disabled>＋</button>
</div>

<div class="result-panel" id="result-panel">
  <div class="result-empty" id="result-empty">Iniciá la cámara y apuntá a la pregunta</div>
</div>

<div class="history-header">
  <h2>Historial</h2>
  <button id="btn-clear">Limpiar todo</button>
</div>
<div id="history"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAA7f_lOBBgEWTnY2sMyJgTGopwwkY13uY",
  authDomain: "lector-preguntas.firebaseapp.com",
  databaseURL: "https://lector-preguntas-default-rtdb.firebaseio.com",
  projectId: "lector-preguntas",
  storageBucket: "lector-preguntas.firebasestorage.app",
  messagingSenderId: "243188251668",
  appId: "1:243188251668:web:27169742115518ab0cbb01"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const $ = id => document.getElementById(id);

// ==== config ====
const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';
const DEFAULT_MODEL = 'google/gemini-2.5-pro';
const PROMPT = `Sos un asistente que responde preguntas de opción múltiple mostradas en una imagen (foto de una pantalla). Analizá la imagen, identificá la pregunta y las opciones, y determiná cuál es la opción correcta.
Respondé ÚNICAMENTE con un JSON válido, sin texto adicional, sin bloques de código markdown, con este formato exacto:
{"pregunta": "enunciado de la pregunta", "respuesta": "texto EXACTO de la opción correcta, copiado tal cual aparece en la imagen"}
Reglas para "respuesta":
- NO la traduzcas. Copiala en el idioma original de la imagen, letra por letra.
- Incluí la letra o número que identifica la opción tal cual aparece en la imagen (ej. "B. Set the Fiscal Year to Custom..."), seguido del texto completo de la opción.
- Si hay más de una opción correcta (ej. "Choose 2 answers"), poné cada una en una línea separada por un salto de línea "\\n", cada una con su letra/número correspondiente.
Si la imagen no contiene una pregunta de opción múltiple legible, respondé: {"error": "No se detectó una pregunta de opción múltiple en la imagen"}`;

let apiKey = localStorage.getItem('lp_api_key') || '';
let model = localStorage.getItem('lp_model') || DEFAULT_MODEL;

function updateApiDot() {
  const dot = $('api-dot');
  if (apiKey) { dot.classList.remove('off'); dot.title = 'API conectada'; }
  else         { dot.classList.add('off');    dot.title = 'API no configurada'; }
  const st = $('key-status');
  st.textContent = apiKey
    ? `Key guardada: ${apiKey.slice(0,8)}...${apiKey.slice(-4)} (${apiKey.length} caracteres)`
    : 'Sin key guardada';
  st.style.color = apiKey ? '#4ade80' : '#f87171';
}
updateApiDot();

$('cfg-toggle').onclick = () => {
  const p = $('cfg-panel');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  if (p.style.display === 'flex') {
    $('apikey-input').value = apiKey;
    $('model-input').value = model;
  }
};
$('cfg-save').onclick = () => {
  apiKey = $('apikey-input').value.replace(/\s+/g, '');
  localStorage.setItem('lp_api_key', apiKey);
  updateApiDot();
  showToast(apiKey ? 'API Key guardada' : 'API Key borrada', apiKey ? 'ok' : '');
};
$('model-save').onclick = () => {
  model = $('model-input').value.trim() || DEFAULT_MODEL;
  localStorage.setItem('lp_model', model);
  showToast('Modelo guardado: ' + model, 'ok');
};

// ==== toast ====
let toastTimer;
function showToast(msg, type='') {
  const t = $('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

// ==== camara ====
const video = $('video'), snapshot = $('snapshot'), remoteStatus = $('remote-status');
const zoomOutBtn = $('zoom-out'), zoomInBtn = $('zoom-in'), zoomLabel = $('zoom-label');
let running = false;
let track = null, hwZoom = false, zoomMin = 1, zoomMax = 4, zoomStep = 0.25;
let zoom = parseFloat(localStorage.getItem('lp_zoom') || '1');

$('startbtn').onclick = async () => { running ? stopCamera() : await startCamera(); };

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    video.style.display = 'block'; snapshot.style.display = 'none';
    running = true;
    $('startbtn').textContent = '■ Detener'; $('startbtn').classList.add('on');
    remoteStatus.textContent = '🟢 Lista para disparo remoto';
    remoteStatus.classList.add('linked');

    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    hwZoom = !!caps.zoom;
    if (hwZoom) { zoomMin = caps.zoom.min; zoomMax = caps.zoom.max; zoomStep = caps.zoom.step || 0.5; }
    else { zoomMin = 1; zoomMax = 4; zoomStep = 0.25; }
    zoom = Math.min(Math.max(zoom, zoomMin), zoomMax);
    zoomOutBtn.disabled = false; zoomInBtn.disabled = false;
    applyZoom();
    startPreviewStream();
  } catch (e) { showToast('Error de cámara: ' + e.message, 'err'); }
}
function stopCamera() {
  running = false;
  $('startbtn').textContent = '▶ Iniciar cámara'; $('startbtn').classList.remove('on');
  remoteStatus.textContent = 'Iniciá la cámara para habilitar el disparo remoto';
  remoteStatus.classList.remove('linked');
  zoomOutBtn.disabled = true; zoomInBtn.disabled = true;
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  track = null;
  stopPreviewStream();
}

// ==== vista previa remota (foto chica cada ~2s para el dispositivo control) ====
let previewTimer = null;
const previewCanvas = document.createElement('canvas');
previewCanvas.width = 320;

function startPreviewStream() {
  stopPreviewStream();
  previewTimer = setInterval(() => {
    if (!running || !video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    previewCanvas.height = Math.round(320 * vh / vw);
    const pctx = previewCanvas.getContext('2d');
    if (!hwZoom && zoom > 1) {
      const cropW = vw / zoom, cropH = vh / zoom;
      const sx = (vw - cropW) / 2, sy = (vh - cropH) / 2;
      pctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, previewCanvas.width, previewCanvas.height);
    } else {
      pctx.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
    }
    set(ref(db, 'preview'), { img: previewCanvas.toDataURL('image/jpeg', 0.5), ts: Date.now() });
  }, 2000);
}
function stopPreviewStream() {
  if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
  set(ref(db, 'preview'), null);
}

function applyZoom() {
  if (hwZoom && track) {
    track.applyConstraints({ advanced: [{ zoom }] }).catch(() => {});
    video.style.transform = 'none';
  } else {
    video.style.transform = `scale(${zoom})`;
  }
  zoomLabel.textContent = zoom.toFixed(1) + 'x';
  localStorage.setItem('lp_zoom', zoom);
}
zoomOutBtn.onclick = () => { zoom = Math.max(zoomMin, +(zoom - zoomStep).toFixed(2)); applyZoom(); };
zoomInBtn.onclick = () => { zoom = Math.min(zoomMax, +(zoom + zoomStep).toFixed(2)); applyZoom(); };

function captureAndAnalyze() {
  if (!running) {
    showToast('La cámara no está iniciada en este dispositivo', 'err');
    publishResult({ error: 'La cámara no está iniciada en el dispositivo cámara' });
    return;
  }
  if (!apiKey) {
    showToast('Configurá tu API Key primero (⚙)', 'err'); $('cfg-panel').style.display = 'flex';
    publishResult({ error: 'Falta configurar la API Key en el dispositivo cámara' });
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  if (!hwZoom && zoom > 1) {
    const cropW = video.videoWidth / zoom, cropH = video.videoHeight / zoom;
    const sx = (video.videoWidth - cropW) / 2, sy = (video.videoHeight - cropH) / 2;
    ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.drawImage(video, 0, 0);
  }
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  snapshot.src = dataUrl;
  snapshot.style.display = 'block'; video.style.display = 'none';
  analyze(dataUrl);
}

// ==== disparo remoto (Firebase) ====
let sawInitialTrigger = false;
onValue(ref(db, 'trigger'), (snap) => {
  if (!sawInitialTrigger) { sawInitialTrigger = true; return; }
  if (snap.val()) captureAndAnalyze();
});

// ==== analisis via OpenRouter ====
const ANALYZE_TIMEOUT_MS = 40000;

async function analyze(dataUrl) {
  showLoading();
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), ANALYZE_TIMEOUT_MS);
  try {
    const res = await fetch(OPENROUTER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
        'HTTP-Referer': location.href,
        'X-Title': 'Lector de Preguntas'
      },
      body: JSON.stringify({
        model,
        temperature: 0.2,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: PROMPT },
            { type: 'image_url', image_url: { url: dataUrl } }
          ]
        }]
      }),
      signal: controller.signal
    });
    const data = await res.json();
    if (data.error) throw new Error((data.error.message || JSON.stringify(data.error)) + ' (HTTP ' + res.status + ')');
    const raw = data.choices?.[0]?.message?.content || '';
    const parsed = parseResult(raw);
    renderResult(parsed, dataUrl);
  } catch (e) {
    renderError(e.name === 'AbortError' ? 'El modelo tardó demasiado en responder (más de ' + (ANALYZE_TIMEOUT_MS / 1000) + 's)' : e.message);
  } finally {
    clearTimeout(timeoutId);
  }
}

function parseResult(raw) {
  const cleaned = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  try { return JSON.parse(match ? match[0] : cleaned); }
  catch (e) { return { error: 'No se pudo interpretar la respuesta del modelo', raw }; }
}

function showLoading() {
  $('result-panel').innerHTML = '<div class="loading">⏳ Analizando pregunta...</div>';
}

function renderError(msg) {
  $('result-panel').innerHTML = `<div class="result-empty" style="color:#f87171;">Error: ${escapeHtml(msg)}</div>`;
  showToast('Error al analizar', 'err');
  publishResult({ error: msg });
  scheduleAutoReset();
}

function renderResult(r, dataUrl) {
  if (r.error) { renderError(r.error); return; }
  const lines = String(r.respuesta || '').split('\n').map(s => s.trim()).filter(Boolean);
  const answerHtml = lines.length
    ? lines.map(l => `<div class="answer-big">${escapeHtml(l)}</div>`).join('')
    : `<div class="answer-big">?</div>`;
  $('result-panel').innerHTML = answerHtml;
  showToast('Respuesta enviada al control', 'ok');
  saveHistory(r);
  publishResult(r);
  scheduleAutoReset();
}

function publishResult(r) {
  set(ref(db, 'result'), {
    pregunta: r.pregunta || '',
    respuesta: r.respuesta || '',
    error: r.error || null,
    ts: Date.now()
  });
}

let autoResetTimer;
function scheduleAutoReset() {
  clearTimeout(autoResetTimer);
  autoResetTimer = setTimeout(resetToCamera, 4000);
}

function resetToCamera() {
  snapshot.style.display = 'none'; video.style.display = 'block';
  $('result-panel').innerHTML = '<div class="result-empty" id="result-empty">Esperando disparo remoto...</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ==== historial ====
let records = JSON.parse(localStorage.getItem('lp_records') || '[]');

function saveHistory(r) {
  records.unshift({ pregunta: r.pregunta, respuesta: r.respuesta, ts: Date.now() });
  records = records.slice(0, 50);
  localStorage.setItem('lp_records', JSON.stringify(records));
  renderHistory();
}

function renderHistory() {
  const el = $('history');
  if (!records.length) { el.innerHTML = '<div class="history-empty">Sin preguntas aún</div>'; return; }
  el.innerHTML = records.map(r => `
    <div class="record">
      <div class="q">${escapeHtml(r.pregunta || '')}</div>
      <div class="a">${escapeHtml(r.respuesta || '?')}</div>
      <div class="t">${new Date(r.ts).toLocaleString('es-AR')}</div>
    </div>`).join('');
}

$('btn-clear').onclick = () => {
  if (confirm('¿Borrar todo el historial?')) { records = []; localStorage.removeItem('lp_records'); renderHistory(); }
};

// ==== init ====
renderHistory();
</script>
</body>
</html>
